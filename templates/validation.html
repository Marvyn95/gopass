{% extends "base.html" %}
{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">

            <h3 class="mb-2">🎫 Ticket Scanner</h3>

            <!-- Camera Preview Card -->
            <div id="scanner-card" class="card shadow-sm mb-2 position-relative">

                <!-- Scanner Frame -->
                <div id="scanner-frame"></div>

                <!-- Flash Message Overlay -->
                <div id="flash-overlay">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="flash-msg alert alert-{{ category }}">
                              {{ message }}
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}
                </div>

                <div class="card-body p-1">
                    <!-- Camera Video -->
                    <video id="preview"
                        autoplay
                        playsinline
                        class="border rounded">
                    </video>

                    <canvas id="canvas" hidden></canvas>
                </div>
            </div>

            <!-- Status Text -->
            <div id="qr-result" class="alert alert-secondary">
                Ready to scan...
            </div>

            <!-- Hidden Form -->
            <form id="qr-form"
                  method="POST"
                  action="{{ url_for('validate_qr') }}">
                <input type="hidden" name="qr_data" id="qr-data">
            </form>

        </div>
    </div>
</div>


<!-- Beep -->
<audio id="beep">
    <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
            type="audio/ogg">
</audio>

<!-- jsQR -->
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
    /* Camera video size: original dimensions */
    #preview {
        width: 100%;
        height: 330px;
        max-height: 70vh;
        object-fit: cover;
    }

    /* Scanner frame */
    #scanner-frame {
        position: absolute;
        top: 20%;
        left: 15%;
        width: 70%;
        height: 60%;
        border: 3px solid #00ff00;
        border-radius: 12px;
        z-index: 10;
        pointer-events: none;
        box-shadow: 0 0 20px rgba(0,255,0,0.7);
        transition: border 0.3s, box-shadow 0.3s;
    }

    /* Flash overlay inside scanner */
    #flash-overlay {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        z-index: 30;
        text-align: center;
        pointer-events: none;
    }

    /* Individual flash message */
    .flash-msg {
        font-weight: 600;
        opacity: 0;
        padding: 12px;
        animation: fadeFlash 4s forwards;
    }

    /* Fade animation for flash messages */
    @keyframes fadeFlash {
        0%   { opacity: 0; }
        10%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { opacity: 0; }
    }
</style>

<script>
const video = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d");

const qrResult = document.getElementById("qr-result");
const qrDataInput = document.getElementById("qr-data");
const form = document.getElementById("qr-form");
const beep = document.getElementById("beep");
const scannerFrame = document.getElementById("scanner-frame");

let scanning = true;
let submitted = false;
let stream = null;

// Start camera
startCamera();

function startCamera() {
    navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
    })
    .then(s => {
        stream = s;
        video.srcObject = stream;
        video.play();
        scanning = true;
        submitted = false;
        requestAnimationFrame(scan);
    })
    .catch(() => {
        qrResult.className = "alert alert-danger";
        qrResult.textContent = "❌ Camera not accessible";
    });
}

// Stop camera
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

// Main scan loop
function scan() {
    if (!scanning || submitted) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);

        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
            scanning = false;
            submitted = true;

            beep.play();

            // Success border feedback
            scannerFrame.style.border = "3px solid #28a745";
            scannerFrame.style.boxShadow = "0 0 25px #28a745";

            qrResult.className = "alert alert-success";
            qrResult.innerHTML = "✅ Ticket detected. Processing...";

            qrDataInput.value = code.data;

            stopCamera();

            // Submit backend
            setTimeout(() => { form.submit(); }, 600);

            // Auto-rescan after 5s
            setTimeout(() => { resetScanner(); }, 5000);
            return;
        }
    }

    requestAnimationFrame(scan);
}

// Reset scanner for next scan
function resetScanner() {
    scannerFrame.style.border = "3px solid #00ff00";
    scannerFrame.style.boxShadow = "0 0 20px rgba(0,255,0,0.7)";

    qrResult.className = "alert alert-secondary";
    qrResult.textContent = "Ready to scan...";

    startCamera();
}
</script>

{% endblock %}
